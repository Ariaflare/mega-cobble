plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	// Applying the Kotlin plugin makes Loom remap the Kotlin @Metadata of mod dependencies
	// (Cobblemon) into our mappings. Without this, Cobblemon's Kotlin reflection looks up
	// intermediary names (e.g. net.minecraft.class_2960) that don't exist at dev runtime.
	id 'org.jetbrains.kotlin.jvm' version '2.2.0'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Cobblemon is published here
	maven {
		name = 'Cobblemon'
		url = 'https://maven.impactdev.net/repository/development/'
	}
	// Architectury is a transitive dependency of Cobblemon
	maven {
		name = 'Architectury'
		url = 'https://maven.architectury.dev/'
	}
	// Mod Menu / Terraformers (optional integrations)
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Official Mojang mappings — matches the mappings Cobblemon is developed against,
	// so its exposed Minecraft types line up 1:1 with our code (no Yarn translation).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Kotlin runtime required by Cobblemon
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Cobblemon itself (the API we build the Mega Evolution PoC against)
	modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
